<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexaFlow — Animated Logo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; background: #050914;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .logo { display: flex; align-items: center; gap: 19px; color: #f4f8ff; }
    .mark { width: 82px; height: 82px; position: relative; filter: drop-shadow(0 0 15px #16c8ff80); }
    .track { fill: none; stroke: #1a2d50; stroke-width: 7; stroke-linecap: round; }
    .flow {
      fill: none; stroke: url(#flow-gradient); stroke-width: 7; stroke-linecap: round;
      stroke-dasharray: 46 166; animation: stream 2.55s linear infinite;
    }
    .flow:nth-of-type(3) { animation-delay: -1.275s; opacity: .82; }
    .core { fill: #baf2ff; animation: pulse 2.55s ease-in-out infinite; }
    .word { font-size: 42px; font-weight: 720; letter-spacing: -1.9px; }
    .word span { color: #36d4ff; }
    .glow { position: fixed; width: 420px; height: 420px; border-radius: 50%; background: #09598a55; filter: blur(88px); z-index: -1; }
    @keyframes stream { to { stroke-dashoffset: -212; } }
    @keyframes pulse { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.25); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .core { animation: none; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo" role="img" aria-label="NexaFlow animated logo">
    <svg class="mark" viewBox="0 0 82 82" aria-hidden="true">
      <defs>
        <linearGradient id="flow-gradient" x1="0" y1="1" x2="1" y2="0">
          <stop stop-color="#7c5cff"/><stop offset=".48" stop-color="#22d7ff"/><stop offset="1" stop-color="#a6f7ff"/>
        </linearGradient>
      </defs>
      <path class="track" d="M13 57c11-31 24-31 34 0s21 31 30 0"/>
      <path class="track" d="M5 41c12-31 25-31 36 0s22 31 36 0"/>
      <path class="flow" d="M13 57c11-31 24-31 34 0s21 31 30 0"/>
      <path class="flow" d="M5 41c12-31 25-31 36 0s22 31 36 0"/>
      <circle class="core" cx="41" cy="41" r="3"/>
    </svg>
    <div class="word">nexa<span>flow</span></div>
  </div>
</body>
</html>
